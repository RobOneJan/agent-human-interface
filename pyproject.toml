[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-hub"
version = "0.1.0"
description = "Channel-agnostic Claude agent core with a Telegram adapter, driving one or more MCP servers (email-mcp-server first)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic[mcp]>=0.115",
    "mcp>=2.0,<3",
    "python-telegram-bot>=21.0",
    "google-auth>=2.28.0",
    "requests>=2.31.0",  # google.auth.transport.requests needs this explicitly - not pulled in by google-auth alone
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
agent-hub = "agent_hub.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
