# Cloud Build CI/CD: build the image, push it to Artifact Registry, deploy to
# Cloud Run. Mirrors email-mcp-server's cloudbuild.yaml.
#
# --max-instances=1 stays pinned regardless of channel: chat_history and
# _graph_ready (teams_bot.py) are in-memory, keyed per conversation/tenant,
# with no cross-instance sharing - two instances would each answer with only
# half the context. --min-instances=1/--no-cpu-throttling were originally
# about Telegram's long-polling loop needing to run continuously with no
# inbound HTTP to trigger CPU allocation; kept as-is under Teams too (a
# webhook), where they now just mean "always warm, no cold start on the
# first Teams message" - fine for a low-traffic internal bot, revisit if
# cost ever matters more than latency here.
substitutions:
  _REGION: europe-west3
  _REPO: agent-hub
  _SERVICE: agent-hub
  # Comma-separated Telegram chat ids allowed to use the bot - unused while
  # main.py runs teams_bot.py instead of telegram_bot.py, kept for a future
  # revert. Set as a trigger-level substitution - see README "Deploying".
  _TELEGRAM_ALLOWED_CHAT_IDS: ""
  # Same Azure AD app registration as email-mcp-server's
  # GRAPH_CLIENT_ID/GRAPH_TENANT_ID (see that repo's .env.example) - this app
  # doubles as both the Bot's own identity and the Graph on-behalf-of
  # client. Not secret; set as trigger-level substitutions - see README's
  # Azure setup steps. TEAMS_APP_PASSWORD (the client secret) is a Secret
  # Manager secret instead, see the deploy step below.
  _TEAMS_APP_ID: ""
  _TEAMS_APP_TENANT_ID: ""

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      # Publicly reachable now: Microsoft's Bot Framework Connector calls
      # this service's POST /api/messages from outside GCP to deliver every
      # Teams message, and it has no Google-signed identity for Cloud Run's
      # own IAM layer to check - so that layer must let every request
      # through. The real security boundary is the Bot Framework JWT check
      # CloudAdapter itself performs on every request before any bot code
      # runs (verified locally: an unsigned request gets a 401 straight from
      # the app) - see teams_bot.py's module docstring.
      - --allow-unauthenticated
      - --min-instances=1
      - --max-instances=1
      - --no-cpu-throttling
      - --service-account=agent-hub-run@$PROJECT_ID.iam.gserviceaccount.com
      - --set-secrets=TELEGRAM_BOT_TOKEN=agent-hub-telegram-bot-token:latest,ANTHROPIC_API_KEY=agent-hub-anthropic-api-key:latest,TEAMS_APP_PASSWORD=agent-hub-teams-app-password:latest
      # ^@^ switches the pair-separator from "," to "@" for this whole flag,
      # since MCP_SERVERS' own value needs a literal "," between servers -
      # see terbox-erp-mcp's own note on this exact gcloud footgun.
      - --update-env-vars=^@^MCP_SERVERS=email=https://email-mcp-server-pdzqlk5ioq-ey.a.run.app/mcp,terbox=https://terbox-erp-mcp-pdzqlk5ioq-ey.a.run.app/mcp@TELEGRAM_ALLOWED_CHAT_IDS=${_TELEGRAM_ALLOWED_CHAT_IDS}@TEAMS_APP_ID=${_TEAMS_APP_ID}@TEAMS_APP_TENANT_ID=${_TEAMS_APP_TENANT_ID}@PUBLIC_BASE_URL=https://agent-hub-pdzqlk5ioq-ey.a.run.app

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
